version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:14-alpine
    container_name: serverm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serverm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serverm"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:6-alpine
    container_name: serverm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # TDengine数据库（可选）
  tdengine:
    image: tdengine/tdengine:3.0
    container_name: serverm-tdengine
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - tdengine-data:/var/lib/taos
    restart: unless-stopped

  # serverM应用服务
  serverm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serverm-server
    ports:
      - "8080:8080"
      - "30022:22"  # SSH隧道端口
    environment:
      # 数据库连接配置
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: serverm
      DB_USER: postgres
      DB_PASSWORD: postgres
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      
      # 应用配置
      CONFIG_PATH: /app/config/configs/config.yaml
      GIN_MODE: release
      PUBLIC_SERVER_IP: localhost  # 本地开发使用localhost
      
      # 反向SSH配置
      SSH_TUNNEL_USERNAME: tunneluser
      SSH_TUNNEL_PASSWORD: tunnelpass
      SCRIPT_START_PORT: "30000"
      SCRIPT_END_PORT: "30100"
    volumes:
      - ./config/configs:/app/config/configs
      - ./asset/script:/app/asset/script
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  tdengine-data: